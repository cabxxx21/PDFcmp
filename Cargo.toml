[workspace]
resolver = "2"
members = [
    "core",
    "cli",
]
exclude = ["gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight, cross-distro PDF compressor for Linux"
repository = "https://github.com/cabxxx21/PDFcmp"
authors = ["cabxp"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tempfile = "3.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
clap = { version = "4.5", features = ["derive", "env"] }
mupdf = "0.8"
walkdir = "2.5"
rayon = "1.10"
humantime = "2.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[profile.release.with-debug]
debug = true
